name: Render HyperFrames Short

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note'
        required: false
        default: 'viral short'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install HyperFrames CLI
        run: npm install -g hyperframes

      - name: Create multi-scene viral short
        run: |
          mkdir -p viral-short
          cat > viral-short/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#fff; font-family:'Arial Black', Arial, sans-serif; overflow:hidden; }
    .scene { position:absolute; width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
    .hook { background:linear-gradient(135deg,#000,#111); }
    .hook h1 { font-size:72px; color:#0f0; text-align:center; line-height:1.1; animation: slam 0.6s ease-out; }
    .reveal { background:#0a0a0a; }
    .reveal h2 { font-size:64px; color:#fff; text-align:center; }
    .end { background:radial-gradient(circle,#1a1a1a,#000); }
    .end h1 { font-size:80px; color:#0f0; animation: pulse 1s infinite; }
    @keyframes slam { from { transform:scale(2); opacity:0; } to { transform:scale(1); opacity:1; } }
    @keyframes pulse { 50% { transform:scale(1.08); } }
  </style>
</head>
<body>
  <section class="clip" data-start="0" data-duration="5">
    <div class="scene hook">
      <h1>THIS ONE MOVE<br>MADE $2.4M</h1>
    </div>
  </section>
  <section class="clip" data-start="5" data-duration="5">
    <div class="scene reveal">
      <h2>WHILE EVERYONE<br>WAS SLEEPING</h2>
    </div>
  </section>
  <section class="clip" data-start="10" data-duration="5">
    <div class="scene end">
      <h1>DON'T MISS<br>THE NEXT ONE</h1>
    </div>
  </section>
</body>
</html>
EOF

      - name: Render video
        run: |
          cd viral-short
          npx hyperframes render --output ../viral-short.mp4 --resolution portrait || echo "Render failed"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-short-mp4
          path: viral-short.mp4
          if-no-files-found: warn
